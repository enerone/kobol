name: ${COMPOSE_PROJECT_NAME:-kobol-hermes}

services:
  redis:
    image: redis:8.6.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  omniroute:
    image: diegosouzapw/omniroute:3.8.52
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?set OMNIROUTE_INITIAL_PASSWORD}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET:?set OMNIROUTE_WS_BRIDGE_SECRET}
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:-2048}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${OMNIROUTE_DASHBOARD_PORT:-20128}:20128"
      - "${APP_BIND_HOST:-127.0.0.1}:${OMNIROUTE_API_PORT:-20129}:20129"
      - "${APP_BIND_HOST:-127.0.0.1}:${OMNIROUTE_LIVE_WS_PORT:-20132}:20132"
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  hermes:
    image: nousresearch/hermes-agent@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:?set HERMES_DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?set HERMES_DASHBOARD_PASSWORD}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${HERMES_API_PORT:-8642}:8642"
      - "${APP_BIND_HOST:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - hermes-data:/opt/data
    depends_on:
      omniroute:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true

volumes:
  hermes-data:
  omniroute-data:
  redis-data:
