name: ${COMPOSE_PROJECT_NAME:-kobol-hermes}

services:
  redis:
    image: redis:8.6.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  omniroute:
    image: diegosouzapw/omniroute:3.8.52
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?set OMNIROUTE_INITIAL_PASSWORD}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET:?set OMNIROUTE_WS_BRIDGE_SECRET}
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:-2048}
      OMNIROUTE_CODEX_APPSERVER_WS: ws://codex-app-server:1456
      OMNIROUTE_CODEX_APPSERVER_WS_TOKEN_FILE: /run/codex-appserver/token
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${OMNIROUTE_DASHBOARD_PORT:-20128}:20128"
      - "${APP_BIND_HOST:-127.0.0.1}:${OMNIROUTE_API_PORT:-20129}:20129"
      - "${APP_BIND_HOST:-127.0.0.1}:${OMNIROUTE_LIVE_WS_PORT:-20132}:20132"
    volumes:
      - omniroute-data:/app/data
      - codex-appserver-token:/run/codex-appserver
      - codex-appserver-home:/home/node/.codex
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  codex-app-server:
    build:
      context: docker/codex-app-server
      args:
        CODEX_VERSION: 0.163.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        TOKEN_FILE=/run/codex-appserver/token
        mkdir -p /run/codex-appserver
        if [ ! -s "$$TOKEN_FILE" ]; then
          TF="$$TOKEN_FILE" node -e 'require("fs").writeFileSync(process.env.TF, require("crypto").randomBytes(32).toString("hex"))'
          chmod 600 "$$TOKEN_FILE"
        fi
        chown -R node:node /run/codex-appserver /home/node/.codex
        exec runuser -u node -- codex app-server \
          --listen ws://0.0.0.0:1456 \
          --ws-auth capability-token \
          --ws-token-file "$$TOKEN_FILE"
    environment:
      CODEX_HOME: /home/node/.codex
      RUST_LOG: ${CODEX_APPSERVER_RUST_LOG:-warn}
    volumes:
      - codex-appserver-token:/run/codex-appserver
      - codex-appserver-home:/home/node/.codex
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1456/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  hermes:
    image: nousresearch/hermes-agent@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:?set HERMES_DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?set HERMES_DASHBOARD_PASSWORD}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?set OMNIROUTE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${HERMES_API_PORT:-8642}:8642"
      - "${APP_BIND_HOST:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - hermes-data:/opt/data
    depends_on:
      omniroute:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true

volumes:
  hermes-data:
  omniroute-data:
  redis-data:
  codex-appserver-token:
  codex-appserver-home:
